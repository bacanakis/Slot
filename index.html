<style>
:root{--gold:#f2c14e;--gold2:#a8791c;--red:#c4122f;--led:#ffb020;--ink:#fff3d6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

.bulbs.t{top:-7px}.bulbs.b{bottom:-7px}

.ball{position:absolute;left:-8px;top:-18px;width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff9fb0,#d01232 60%,#6a0016)}
.lever.pull .arm{animation:pa .8s ease}
@keyframes pa{0%{transform:scaleY(1)}40%{transform:scaleY(-.3)}100%{transform:scaleY(1)}}
.panel{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:12px}
.led{background:#0a0300;border:2px solid #3b2a08;border-radius:8px;text-align:center;padding:5px 2px;box-shadow:inset 0 0 10px #000}
.led small{display:block;font-size:.58rem;letter-spacing:.15em;color:#c79a4a}

.bets button:nth-child(2){background:radial-gradient(circle at 35% 30%,#3fc27a,#106b3a);box-shadow:0 3px 0 #083a1f}
.bets button:nth-child(3){background:radial-gradient(circle at 35% 30%,#e06a6a,#8a1717);box-shadow:0 3px 0 #4a0a0a}
.bets button:nth-child(4){background:radial-gradient(circle at 35% 30%,#555,#111);box-shadow:0 3px 0 #000}
.bets button.on{outline:3px solid var(--gold);transform:translateY(-3px)}
.spin{width:100%;padding:16px;border:0;border-radius:14px;font-size:1.35rem;font-weight:900;letter-spacing:.12em;color:#fff;background:linear-gradient(#ff3d5f,var(--red) 55%,#8a0c20);box-shadow:0 5px 0 #4d0612,0 0 0 3px var(--gold)}
.spin:active{transform:translateY(4px);box-shadow:0 1px 0 #4d0612,0 0 0 3px var(--gold)}
.spin:disabled{opacity:.55}
.row{display:flex;gap:8px;margin-top:10px}
.sm{flex:1;padding:9px 4px;border-radius:10px;border:2px solid var(--gold2);background:#2a0610;color:var(--ink);font-size:.8rem}
.tray{margin:12px auto 0;width:70%;height:22px;border-radius:0 0 40px 40px;background:linear-gradient(#050101,#2a1a06);border:3px solid var(--gold2);border-top:0;box-shadow:inset 0 6px 10px #000}
.pay{margin-top:14px;background:#14030a;border:2px solid var(--gold2);border-radius:12px;padding:10px;font-size:.82rem;color:#e9c9a0}
.pay summary{cursor:pointer;color:var(--gold);font-weight:700;text-align:center}
.pay div{display:flex;justify-content:space-between;padding:2px 0}
.note{margin-top:10px;font-size:.7rem;color:#b88;text-align:center}
.s7{font-family:Georgia,"Times New Roman",serif;font-weight:900;font-size:1.3em;font-style:normal;background:linear-gradient(#fff3a6,#f2c14e 50%,#b27a10);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 1px #4a2f00) drop-shadow(0 1px 0 #6b4a00)}
.bigwin{position:absolute;inset:0;z-index:10;display:none;align-items:center;justify-content:center;pointer-events:none;overflow:hidden;border-radius:12px;background:radial-gradient(circle,rgba(0,0,0,.78),rgba(0,0,0,.4) 75%)}
.bigwin.on{display:flex;animation:bwin 2.8s ease forwards}
.rays{position:absolute;left:50%;top:50%;width:300%;aspect-ratio:1;margin:-150% 0 0 -150%;background:repeating-conic-gradient(rgba(255,214,90,.35) 0 10deg,transparent 10deg 20deg);animation:spinr 6s linear infinite}
@keyframes spinr{to{transform:rotate(360deg)}}
@keyframes bwin{0%{opacity:0}10%{opacity:1}85%{opacity:1}100%{opacity:0}}
.bw{position:relative;text-align:center;animation:bwpop .7s cubic-bezier(.2,1.6,.4,1)}
@keyframes bwpop{0%{transform:scale(.2) rotate(-8deg)}100%{transform:scale(1) rotate(0)}}
.bw small{display:block;font-family:Georgia,serif;font-weight:900;font-size:1.5rem;letter-spacing:.12em;color:#fff;text-shadow:0 0 10px #ff9d00,0 2px 0 #7a4a00}
.bw b{display:block;font-family:Georgia,serif;font-size:3.6rem;line-height:1.05;background:linear-gradient(#fff6b8,#f2c14e 50%,#c58a12);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #5a3b08) drop-shadow(0 0 12px #ff9d00)}
.bigwin.jp .bw small{color:#ffd54a;font-size:1.9rem}
.coin{position:fixed;top:-30px;font-size:26px;z-index:50;pointer-events:none;animation:fall 1.4s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
</style></head><body>
<div class="app"><div class="cab">
<div class="sign"><div class="bulbs t"></div><h1>LUCKY 7</h1><small>ŞANS ÇARKI · SANAL OYUN</small><div class="bulbs b"></div></div>
<div class="win"><div class="reels" id="reels"><div class="reel"></div><div class="reel"></div><div class="reel"></div><div class="reel"></div><div class="reel"></div><div class="pline"></div></div><div class="bigwin" id="bigwin"><div class="rays"></div><div class="bw"><small id="bwl"></small><b id="bwa"></b></div></div><i class="arr l"></i><i class="arr r"></i></div>

<script>
const ST=["🍒","🍋","🍇","🔔","🍒","⭐","🍋","🔔","🍒","7️⃣","🍇","💎"];
const MUL={"🍒":5,"🍋":8,"🍇":12,"🔔":20,"⭐":40,"7️⃣":80,"💎":150};
const N=12,STEP=30,R=130;
let bal=1000,bet=10,busy=false,sound=true;
try{const v=localStorage.getItem("slot2bal");if(v!==null&&!isNaN(+v))bal=+v;if(localStorage.getItem("slot2snd")==="0")sound=false}catch(e){}
const $=id=>document.getElementById(id);
document.querySelectorAll(".bulbs").forEach(b=>{for(let i=0;i<16;i++)b.appendChild(Object.assign(document.createElement("i"),{className:"bulb"}))});
const reels=[...document.querySelectorAll(".reel")];
const rot=[0,0,0,0,0],drums=[];
reels.forEach((r,k)=>{const d=document.createElement("div");d.className="drum";
ST.forEach((s,i)=>{const f=document.createElement("div");f.className="face";f.innerHTML=sym(s);f.style.transform="rotateX("+(i*STEP)+"deg) translateZ("+R+"px)";d.appendChild(f)});
r.appendChild(d);drums.push(d);rot[k]=-STEP*Math.floor(Math.random()*N);draw(k)});
function draw(k){drums[k].style.transform="translateZ(-"+R+"px) rotateX("+rot[k]+"deg)"}
function save(){try{localStorage.setItem("slot2bal",bal);localStorage.setItem("slot2snd",sound?1:0)}catch(e){}}
function show(){$("bal").textContent=bal;$("bet").textContent=bet;$("snd").textContent=sound?"🔊 Ses açık":"🔇 Ses kapalı";$("spin").disabled=busy||bal<bet;[...$("bets").children].forEach(b=>b.classList.toggle("on",+b.dataset.v===bet))}
[5,10,25,50].forEach(v=>{const b=document.createElement("button");b.textContent=v;b.dataset.v=v;b.onclick=()=>{if(!busy){bet=v;beep(600,.05,"square",.04);show()}};$("bets").appendChild(b)});
let ac,bwT;
function unlock(){try{if(navigator.audioSession)navigator.audioSession.type="playback";ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state!=="running")ac.resume()}catch(e){}}
["touchstart","touchend","pointerdown","click","keydown"].forEach(ev=>document.addEventListener(ev,unlock,{passive:true}));
function sym(s){return s.charAt(0)==="7"?'<b class="s7">7</b>':s}
function showBig(w,jp){const b=$("bigwin");$("bwl").textContent=jp?"JACKPOT!":"KAZANDIN!";$("bwa").textContent="+"+w;b.classList.toggle("jp",jp);b.classList.remove("on");void b.offsetWidth;b.classList.add("on");clearTimeout(bwT);bwT=setTimeout(()=>b.classList.remove("on"),2800)}
function beep(f,d=.08,t="sine",v=.07){if(!sound)return;try{unlock();const o=ac.createOscillator(),g=ac.createGain();o.type=t;o.frequency.value=f;g.gain.value=v*1.5;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.stop(ac.currentTime+d)}catch(e){}}
const ease=t=>{const s=.7,u=t-1;return 1+(s+1)*u*u*u+s*u*u};
function spinReel(k,idx,dur,turns){return new Promise(res=>{
const r0=rot[k],base=-idx*STEP,need=r0-360*turns,r1=base+360*Math.floor((need-base)/360);
let t0=null,last=Math.floor(r0/STEP);
function f(ts){if(t0===null)t0=ts;let p=Math.min((ts-t0)/dur,1);rot[k]=r0+(r1-r0)*ease(p);draw(k);
const c=Math.floor(rot[k]/STEP);if(c!==last){last=c;if(k===0||p>.7)beep(900,.02,"square",.015)}
if(p<1)requestAnimationFrame(f);else{rot[k]=r1;draw(k);res()}}
requestAnimationFrame(f)})}
function coins(n){for(let i=0;i<n;i++){const c=document.createElement("span");c.className="coin";c.textContent="🪙";c.style.left=Math.random()*95+"vw";c.style.animationDelay=Math.random()*.7+"s";document.body.appendChild(c);setTimeout(()=>c.remove(),2400)}}
function count(to){let v=0;const st=Math.max(1,Math.ceil(to/25));const iv=setInterval(()=>{v=Math.min(to,v+st);$("won").textContent=v;if(v>=to)clearInterval(iv)},35)}
async function spin(){
if(busy||bal<bet)return;busy=true;bal-=bet;save();show();
$("bigwin").classList.remove("on");$("won").textContent=0;reels.forEach(r=>r.classList.remove("hit"));
const lv=$("lever");lv.classList.remove("pull");void lv.offsetWidth;lv.classList.add("pull");
const m=$("msg");m.textContent="Slot dönüyor…";beep(160,.25,"sawtooth",.05);
const idx=[0,1,2,3,4].map(()=>Math.floor(Math.random()*N));
await Promise.all(idx.map((x,k)=>spinReel(k,x,1700+k*380,4+k*2).then(()=>beep(140,.1,"triangle",.12))));
